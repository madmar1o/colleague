name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks that need no build. Everything runs on the single
  # self-hosted runner. GitHub-hosted runners could build through the public
  # p2 repositories (edt.1c.ru, download.eclipse.org) but cannot reach the
  # local SonarQube, so a hosted fallback path would only duplicate the build
  # half of the pipeline and was removed as redundant.
  # Fork pull requests are skipped by design: untrusted code must never run on
  # the self-hosted machine (see docs/ci/SETUP-GITHUB.md).
  hygiene:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, colleague]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # never wipe the workspace: the hygiene job runs before build-test
          # in the same workspace, and git clean would delete the previous
          # build output that later steps (jacoco, sonar) rely on
          clean: false

      - name: Conventional commit subjects
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq 'pull_request') {
            $range = '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'
          } else {
            $before = '${{ github.event.before }}'
            git rev-parse --verify --quiet $before | Out-Null
            if ($LASTEXITCODE -eq 0) { $range = "$before..${{ github.sha }}" } else { $range = 'HEAD~1..HEAD' }
          }
          $pattern = '^(chore|feat|fix|docs|refactor|test|build|ci|revert)(\([a-z0-9._-]+\))?: .{3,}'
          $bad = @(git log --format=%s $range | Where-Object { $_ -notmatch $pattern })
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host "bad subject: $_" }; exit 1 }
          Write-Host "subjects OK: $range"

      - name: Repository is free of third-party AI product names
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/sanitize_check.ps1

      - name: No tracked secrets or oversized files
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in (git ls-files)) {
            if ($f -match '\.(env|key|pem|token)$' -or $f -match 'credential|secret') { Write-Host "forbidden file: $f"; $bad = 1 }
            if ((Test-Path -LiteralPath $f -PathType Leaf) -and ((Get-Item -LiteralPath $f).Length -gt 1048576)) { Write-Host "over 1MB: $f"; $bad = 1 }
          }
          exit $bad

      - name: CI gate canon tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/test_ci_gates.ps1

      # Convention gates over the change set. BASE_REF is the merge base for
      # pull requests and the pre-push tip for pushes to main.
      - name: Resolve base ref for convention gates
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq 'pull_request') {
            "BASE_REF=${{ github.event.pull_request.base.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            $before = '${{ github.event.before }}'
            git rev-parse --verify --quiet $before | Out-Null
            if ($LASTEXITCODE -eq 0) { $base = $before } else { $base = 'HEAD~1' }
            "BASE_REF=$base" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Javadoc on new public API
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/javadoc_check.ps1 -BaseRef $env:BASE_REF

      - name: Frozen build coordinates
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/version_freeze_check.ps1 -BaseRef $env:BASE_REF

  # Full Tycho build and the whole test suite. Self-hosted because the target
  # platform and the Maven cache are already warm on the build machine.
  build-test:
    needs: hygiene
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, colleague]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # no clean: true - the compiled classes stay in the workspace for the
          # sonar-gate job (sonar.java.binaries); `mvnw clean verify` itself
          # guarantees a from-scratch build of the sources
          clean: false

      - name: Java 17
        shell: powershell
        run: |
          # the JDK location is a property of the runner machine, not of the
          # repository: JAVA_HOME_17 names it, plain JAVA_HOME is the fallback
          if ($env:JAVA_HOME_17 -and (Test-Path "$env:JAVA_HOME_17\bin\java.exe")) {
            "JAVA_HOME=$env:JAVA_HOME_17" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "$env:JAVA_HOME_17\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } elseif (-not ($env:JAVA_HOME -and (Test-Path "$env:JAVA_HOME\bin\java.exe"))) {
            Write-Host '::error::no JDK on the runner: set JAVA_HOME_17 (or JAVA_HOME) in the runner .env file'
            exit 1
          }
          java -version

      - name: Build and test
        shell: powershell
        run: .\mvnw.cmd -B clean verify

      - name: Path guard canon (JS vs Java)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/test_path_guard.ps1

      - name: Aggregate JaCoCo coverage
        shell: powershell
        continue-on-error: true
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/jacoco_report.ps1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          if-no-files-found: warn
          path: |
            bundles/*/target/surefire-reports/**
            bundles/*/target/site/jacoco/**
            out/ci/jacoco.xml

  # Packaging proof for every PR: the built Tycho site must install through the
  # plain p2 director into a throwaway profile — the same transport an end user
  # gets from the update site. Needs no secrets, so it is safe by construction
  # even if a fork PR were ever allowed to run here.
  install-check:
    needs: build-test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, colleague]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false   # the built site from build-test stays in the workspace

      - name: Deploy into a scratch copy of the CI instance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:USERPROFILE 'CI_EDT\install-check'
          if (Test-Path $scratch) { Remove-Item -Recurse -Force $scratch }
          $log = powershell -NoProfile -ExecutionPolicy Bypass -File tools/acceptance/edt_deploy_feature.ps1 `
            -EdtHomes $env:EDT_CI_HOME -ScratchCopy $scratch 2>&1 | Out-String
          $log | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($log -notmatch 'DEPLOY QUALIFIER=v(\d{12})') { throw 'deploy reported no qualifier stamp' }
          $stamp = 'v' + $Matches[1]
          # the patched bundles.info of the scratch copy and the pool jars are
          # the proof the built site installs: every referenced jar must exist
          $pool = $env:EDT_CI_POOL
          if (-not $pool) { $pool = Join-Path $env:USERPROFILE '.p2\pool\plugins' }
          $missing = 0
          $info = Join-Path $scratch 'configuration\org.eclipse.equinox.simpleconfigurator\bundles.info'
          $hits = @(Select-String -Path $info -Pattern 'com\.mad\.edt\.colleague' | ForEach-Object { $_.Line })
          if ($hits.Count -ne 3) { Write-Host "bundles.info carries $($hits.Count) colleague lines, expected 3"; $missing = 1 }
          foreach ($line in $hits) {
            if ($line -notmatch ('1\.0\.0\.' + $stamp)) { Write-Host "line not stamped: $line"; $missing = 1 }
          }
          foreach ($m in @('com.mad.edt.colleague', 'com.mad.edt.colleague.context', 'com.mad.edt.colleague.ui')) {
            $jar = @(Get-ChildItem $pool -Filter ($m + '_1.0.0.' + $stamp + '.jar'))
            if ($jar.Count -ne 1) { Write-Host "pool jar for $m ($stamp) is missing"; $missing = 1 }
          }
          exit $missing

  # Live acceptance of the merged build: deploy into the dedicated CI EDT
  # instance (EDT_CI_HOME/EDT_CI_PROFILE from the runner .env — never the
  # developer's own EDT), launch it with the web bridge, wait for the plugin
  # activation marker, run bridge_smoke (8 checks), stop the instance.
  # Runs only on trusted triggers (push to main, manual dispatch) and is
  # serialized: the CI instance is single-tenant.
  live-acceptance:
    needs: [build-test, sonar-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, x64, colleague]
    timeout-minutes: 45
    concurrency: live-acceptance
    outputs:
      smoke: ${{ steps.smoke.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Deploy the built feature into the CI EDT
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/acceptance/edt_deploy_feature.ps1   # homes and pool from EDT_CI_HOME / EDT_CI_DEV_HOME / EDT_CI_POOL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Launch the CI EDT with the web bridge
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:JAVA_HOME_17 -and (Test-Path "$env:JAVA_HOME_17\bin\javaw.exe")) {
            $env:JAVA_HOME = $env:JAVA_HOME_17
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/acceptance/edt_launch_ci.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Wait for plugin activation
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/acceptance/edt_wait_activated.ps1 -TimeoutSec 300
          exit $LASTEXITCODE

      - name: Bridge smoke
        id: smoke
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/acceptance/bridge_smoke.ps1 -OutDir out
          $code = $LASTEXITCODE
          "outcome=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit $code

      - name: Stop the CI EDT and keep evidence
        if: always()
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/acceptance/edt_stop_ci.ps1
          if (Test-Path "$env:EDT_CI_PROFILE\.metadata\.log") {
            New-Item -ItemType Directory -Force out | Out-Null
            Get-Content "$env:EDT_CI_PROFILE\.metadata\.log" -Tail 200 | Set-Content out/ci_edt_metadata_log_tail.txt -Encoding utf8
          }

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            out/bridge_smoke_*.md
            out/ci_edt_metadata_log_tail.txt

      - name: Fail the job when the smoke did not pass
        if: steps.smoke.outcome != '0'
        shell: bash
        run: exit 1

  # SonarQube gate. Runs after the build so the analysis uses fresh classes.
  # Community Edition has no branch analysis, so the branch is analysed into a
  # dedicated project key that stays on the server as the CI history; the gate
  # compares the open-issue set with the committed baseline.
  sonar-gate:
    needs: build-test
    runs-on: [self-hosted, windows, x64, colleague]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # keep the compiled classes of the build-test job in the workspace
          # (git clean would delete target/classes and the scanner would lose
          # sonar.java.binaries)
          clean: false

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-reports
          path: ci-artifacts

      - name: Scan and gate
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # the public address of the SonarQube instance; the scanner reaches
          # the same server through its container bridge address (see sonar_scan.ps1)
          SONAR_HOST_URL: https://son.plaksin.crazedns.ru
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          Write-Host "analysing $ref"
          $cov = 'ci-artifacts/out/ci/jacoco.xml'
          if (Test-Path $cov) {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/sonar_scan.ps1 -ProjectKey colleague-edt-ci -ExtraProps "-Dsonar.coverage.jacoco.xmlReportPaths=$cov"
          } else {
            Write-Host "no coverage artifact; analysis runs without coverage"
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/sonar_scan.ps1 -ProjectKey colleague-edt-ci
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $rule = ''
          if ($ref -match '(?i)sonar[-_/]?(S\d{3,5})') { $rule = $Matches[1] }
          elseif ($ref -match '(?i)\b(S\d{3,5})\b') { $rule = $Matches[1] }
          if ($rule) {
            Write-Host "fix-branch gate for rule $rule"
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/sonar_gate.ps1 -Rule $rule
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/sonar_gate.ps1
          }
          exit $LASTEXITCODE

