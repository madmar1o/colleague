name: nightly

on:
  schedule:
    - cron: '0 22 * * *'   # 05:00 Asia/Bangkok
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly:
    runs-on: [self-hosted, windows, x64, colleague]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        shell: powershell
        run: |
          # the JDK location is a property of the runner machine, not of the
          # repository: JAVA_HOME_17 names it, plain JAVA_HOME is the fallback
          if ($env:JAVA_HOME_17 -and (Test-Path "$env:JAVA_HOME_17\bin\java.exe")) {
            "JAVA_HOME=$env:JAVA_HOME_17" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "$env:JAVA_HOME_17\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } elseif (-not ($env:JAVA_HOME -and (Test-Path "$env:JAVA_HOME\bin\java.exe"))) {
            Write-Host '::error::no JDK on the runner: set JAVA_HOME_17 (or JAVA_HOME) in the runner .env file'
            exit 1
          }

      - name: Full build and tests
        shell: powershell
        run: .\mvnw.cmd -B clean verify

      # Nightly live acceptance: the merged build is deployed into the
      # dedicated CI EDT instance and smoke-tested over the web bridge —
      # the same cycle a developer does manually before a release.
      - name: Live acceptance (deploy, launch, activate, smoke)
        id: accept
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Run-Tool($file, [string[]]$toolArgs) {
            & powershell -NoProfile -ExecutionPolicy Bypass -File $file @toolArgs | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "$file failed with exit $LASTEXITCODE" }
          }
          Run-Tool 'tools/acceptance/edt_deploy_feature.ps1' @()
          Run-Tool 'tools/acceptance/edt_launch_ci.ps1' @()
          try {
            Run-Tool 'tools/acceptance/edt_wait_activated.ps1' @('-TimeoutSec', '300')
            Run-Tool 'tools/acceptance/bridge_smoke.ps1' @('-OutDir', 'out')
          } finally {
            & powershell -NoProfile -ExecutionPolicy Bypass -File tools/acceptance/edt_stop_ci.ps1 | Out-Host
          }

      - name: Keep acceptance evidence
        if: always()
        shell: powershell
        run: |
          if (Test-Path "$env:EDT_CI_PROFILE\.metadata\.log") {
            New-Item -ItemType Directory -Force out | Out-Null
            Get-Content "$env:EDT_CI_PROFILE\.metadata\.log" -Tail 200 | Set-Content out/ci_edt_metadata_log_tail.txt -Encoding utf8
          }

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-acceptance-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            out/bridge_smoke_*.md
            out/ci_edt_metadata_log_tail.txt

      - name: Scan main into the main project
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://son.plaksin.crazedns.ru
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/sonar_scan.ps1 -ProjectKey colleague-edt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Drift report against the committed baseline
        id: drift
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $issuesFile = 'out/sonar/colleague-edt-issues.json'
          $issues = Get-Content $issuesFile -Raw | ConvertFrom-Json
          $current = @{}
          foreach ($g in ($issues | Group-Object rule)) { $current[$g.Name] = $g.Count }
          $baseline = Get-Content 'ci/sonar-baseline.json' -Raw | ConvertFrom-Json
          $was = @{}
          foreach ($p in $baseline.counts.PSObject.Properties) { $was[$p.Name] = [int]$p.Value }
          $rows = @()
          foreach ($key in ($current.Keys + $was.Keys | Sort-Object -Unique)) {
            $now = 0; if ($current.ContainsKey($key)) { $now = $current[$key] }
            $then = 0; if ($was.ContainsKey($key)) { $then = $was[$key] }
            if ($now -ne $then) { $rows += [pscustomobject]@{ rule = $key; was = $then; now = $now } }
          }
          $md = @("# Sonar drift $(Get-Date -Format yyyy-MM-dd)", '', "total was $($baseline.total), now $($issues.Count)", '')
          if ($rows.Count -eq 0) { $md += 'No drift against the committed baseline.' }
          else { $rows | ForEach-Object { $md += "- $($_.rule): $($_.was) -> $($_.now)" } }
          $md | Set-Content 'out/sonar/drift.md' -Encoding utf8
          Get-Content 'out/sonar/drift.md'
          "drift=$(if ($rows.Count -gt 0) { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "total=$($issues.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Quality gate on main
        id: gate
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://son.plaksin.crazedns.ru
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci/sonar_gate.ps1 -ProjectKey colleague-edt -IssuesFile out/sonar/colleague-edt-issues.json
          "result=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

      - name: Open an issue when main is not green
        if: steps.drift.outputs.drift == 'true' || steps.gate.outputs.result != '0' || failure()
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path 'out/sonar/drift.md') {
            $body = (Get-Content 'out/sonar/drift.md' -Raw) + "`n`nGate exit code: ${{ steps.gate.outputs.result }}"
          } else {
            $body = "The nightly run failed before or during the acceptance/build stages (run ${{ github.run_id }}). See the uploaded acceptance evidence artifact."
          }
          $body | Out-File -FilePath drift-body.md -Encoding utf8
          gh issue create --title "Nightly failure on main ($(Get-Date -Format yyyy-MM-dd))" --body-file drift-body.md --repo $env:GITHUB_REPOSITORY
