# SonarQube — Colleague (плагин 1C:EDT)
# Запуск анализа: powershell -File ..\tools\sonar_scan.ps1   (сканер в Docker)
# Ключ и токен задаёт скрипт; здесь — только параметры проекта.
sonar.projectKey=colleague-edt
sonar.projectName=Colleague (1C:EDT plugin)
sonar.projectVersion=0.1.0-SNAPSHOT

sonar.sources=bundles
sonar.exclusions=**/target/**,**/generated/**,**/*.class
sonar.sourceEncoding=UTF-8

# Java 17, компилированные классы для семантического анализа
sonar.java.source=17
sonar.java.binaries=**/target/classes

# Кэш сканера — вне дерева репозитория (в контейнере /tmp)
sonar.working.directory=/tmp/.scannerwork
